# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: default

# HTML Language setting
lang: "en"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below

# The output of the plugin can be used below, e.g., {{vars.MediumFollowersCountPlugin}}
# plugins:
#   # Automatically fetch Medium follower count
#   - MediumFollowersCountPlugin:
#       username: zhgchgli
#   # Automatically fetch Github repo star count
#   - GithubRepoStarsCountPlugin:
#       - ZhgChgLi/ZMarkupParser
#       - ZhgChgLi/ZReviewTender
#       - ZhgChgLi/ZMediumToMarkdown
#       - ZhgChgLi/linkyee

# Google Analytics tracking id
# google_analytics_id:

# HTML Title
title: "Carson Farmer"

# Avatar image path
avatar: "./images/profile.png"

# Name section text
name: "Carson Farmer"

# Tagline section text
tagline: "Engineering and R&D | Cofounder & CTO | AI, Machine Learning, & Distributed Systems"

# List of links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# text: The displayed text for the link
# title: The url title
# url: The URL of the link
# alt: Alternative text for accessibility
# target: `_blank` opens in a new tab, `_self` opens in the same frame
links:
  - link:
      icon: "fa-regular fa-calendar"
      text: "Book a chat"
      url: "https://calendar.app.google/AHiwWmnMeeXH9eMP6"
      alt: "Book a chat with Carson"
      title: "Book a chat with Carson"
      target: "_blank"
  - link:
      icon: "fa-brands fa-x-twitter"
      text: "X/Twitter"
      url: "https://x.com/carsonfarmer"
      alt: "Carson's X/Twitter"
      title: "Carson's X/Twitter"
      target: "_blank"
  - link:
      icon: "fa-brands fa-github"
      text: "GitHub"
      url: "https://github.com/carsonfarmer"
      alt: "Carson's GitHub"
      title: "Carson's GitHub"
      target: "_blank"
  - link:
      icon: "fa-brands fa-linkedin"
      text: "LinkedIn"
      url: "https://www.linkedin.com/in/carsonfarmer/"
      alt: "Carson's LinkedIn"
      title: "Carson's LinkedIn"
      target: "_blank"
  - link:
      icon: "fa-brands fa-google-scholar"
      text: "Google Scholar"
      url: "https://scholar.google.ca/citations?user=c28QSJkAAAAJ&hl=en"
      alt: "Carson's Google Scholar"
      title: "Carson's Google Scholar"
      target: "_blank"

# List of social media links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# title: The url title
# url: The URL of the social media link
# alt: Alternative text for accessibility
# target: _blank opens in a new tab, _self opens in the same frame
socials:
  - social:
      icon: "fa-brands fa-x-twitter"
      url: "https://x.com/carsonfarmer"
      title: "Carson's X/Twitter"
      alt: "Carson's X/Twitter"
