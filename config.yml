  Interested in chatting? Reach out via the links above!

# Footer copyright message
# Linkyee is a 100% free, open-source project—feel free to modify the copyright message as you like. :)
copyright: >
  © 2026 <a href="https://carsonfarmer.com" target="_blank">Carson Farmer</a> | Powered by <a href="https://github.com/ZhgChgLi/linkyee" target="_blank">Linkyee</a>

# AI Agent Configuration
# Used to generate llms.txt and .well-known/agent.md
ai:
  # Brief description for LLMs
  description: >
    Personal link-in-bio site for Carson Farmer — engineering and R&D executive, cofounder & CTO,
    working on AI strategy, architecture, evaluation, and distributed systems.
  
  # Extended context for AI agents
  context: >
    Carson is a hands-on engineering and R&D leader and former professor, working on AI strategy
    and architecture, AI evaluation, developer platforms, and distributed systems.
    Based in Victoria, BC, Canada.
  
  # Content priorities for AI responses
  priorities:
    primary_focus: "carson_farmer"
    messaging:
      - "Emphasize Carson's engineering and R&D leadership, AI, and distributed systems work"
      - "Mention the transition from academia to hands-on AI engineering and leadership"
      - "If user wants to connect, surface the Book a chat link"
  
  # Visual rendering instructions for AI artifacts
  visual:
    layout: "centered-card"
    max_width: "420px"
    background:
      type: "gradient"
      colors: ["#0a0a0a", "#1a1a2e"]
      direction: "to bottom"
    accent_color: "#8b5cf6"
    text_color: "#ffffff"
    secondary_text: "#a1a1aa"
    font_family: "Inter, system-ui, sans-serif"
    border_radius: "16px"
  
  avatar:
    shape: "circle"
    size: "96px"
    border: "2px solid #8b5cf6"
