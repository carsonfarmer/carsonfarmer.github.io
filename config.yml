      url: "https://bsky.app/profile/carsonfarmer.com"
      title: "Carson's Bluesky"
      alt: "Carson's Bluesky"
      target: "_blank"
  - social:
      icon: "fa-brands fa-github"
      url: "https://github.com/carsonfarmer"
      title: "Carson's GitHub"
      alt: "Carson's GitHub"
      target: "_blank"
  - social:
      icon: "fa-brands fa-linkedin"
      url: "https://www.linkedin.com/in/carsonfarmer/"
      title: "Carson's LinkedIn"
      alt: "Carson's LinkedIn"
      target: "_blank"
  - social:
